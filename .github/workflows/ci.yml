name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  legacy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
      - name: Legacy unit tests
        run: python -m unittest discover -s tests -t . -v
      - name: Golden master against the legacy engine
        run: python scripts/check_golden_master.py

  fixture-guard:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Golden master must not change
        run: git diff --exit-code "origin/${{ github.base_ref }}" -- tests/fixtures/golden_master.json

  quote-service-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
      - name: Install service dependencies
        run: python -m pip install -r requirements-service.txt
      - name: Start the service
        run: |
          scripts/serve.sh &
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8080/healthz; then exit 0; fi
            sleep 1
          done
          echo "quote service did not become healthy on 127.0.0.1:8080" >&2
          exit 1
      - name: Service tests and golden master replay over HTTP
        run: python -m pytest tests -q
      - name: Syntax check
        run: python -m compileall -q quote_service staywell tests
      - name: Service log
        if: always()
        run: cat logs/quote_service.log || true
